# XcodeGen: `xcodegen generate` → ClearStar.xcodeproj (generált, nincs verziókezelve).
name: ClearStar
options:
  bundleIdPrefix: hu.blackit
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ClearStarCore:
    path: Packages/ClearStarCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClearStar:
    type: application
    platform: macOS
    sources:
      - path: ClearStar
      # A Windows-változattal közös nyelvi fájlok, a bundle Resources/Languages mappájába.
      - path: ../shared/Languages
        type: folder
        buildPhase: resources
      # Jogi szövegek a Névjegyhez: a repó licence és közleményei, a GraXpert-modellek licencei (Resources/Legal).
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD-PARTY-NOTICES.md
        buildPhase: resources
      - path: ../windows/src/ClearStar.App/Legal
        type: folder
        buildPhase: resources
    dependencies:
      - package: ClearStarCore
        product: ClearStarCore
      - package: ClearStarCore
        product: ClearStarAppModel
    info:
      path: ClearStar/Info.plist
      properties:
        CFBundleDisplayName: ClearStar
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: © 2026 Laszlo Fekete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.blackit.clearstar
        PRODUCT_NAME: ClearStar
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Helyi fordításhoz ad-hoc aláírás. Terjesztés: Developer ID Application tanúsítvány + notarizálás (DMG),
        # homokozó nélkül – mint a Siril –, hogy a felhasználó StarNet2-jét és a Siril beállításait elérjük.
        CODE_SIGN_IDENTITY: "-"
schemes:
  ClearStar:
    build:
      targets:
        ClearStar: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ClearStarCore/ClearStarCoreTests
        - package: ClearStarCore/ClearStarAppModelTests
    archive:
      config: Release
