# XcodeGen: `xcodegen generate` → ClearStar.xcodeproj (generált, nincs verziókezelve).
name: ClearStar
options:
  bundleIdPrefix: hu.blackit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ClearStarCore:
    path: Packages/ClearStarCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClearStar:
    type: application
    platform: macOS
    sources:
      - path: ClearStar
      # A Windows-változattal közös nyelvi fájlok, a bundle Resources/Languages mappájába.
      - path: ../shared/Languages
        type: folder
        buildPhase: resources
    dependencies:
      - package: ClearStarCore
    info:
      path: ClearStar/Info.plist
      properties:
        CFBundleDisplayName: ClearStar
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: © 2026 Laszlo Fekete
    entitlements:
      path: ClearStar/ClearStar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.blackit.clearstar
        PRODUCT_NAME: ClearStar
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Helyi fordításhoz ad-hoc aláírás; az App Store-hoz a fejlesztői csapat azonosítója kell (DEVELOPMENT_TEAM).
        CODE_SIGN_IDENTITY: "-"
