server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/html image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # Images and the stylesheet change only with a new image build; a day of
  # caching keeps a redeploy visible the next day without a hard refresh.
  location ~* \.(webp|jpg|png|css)$ {
    add_header Cache-Control "public, max-age=86400";
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
