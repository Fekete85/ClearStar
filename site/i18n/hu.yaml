supportText: >-
  A ClearStar ingyenes és nyílt forráskódú – egy amatőr csillagász hobbiprojektje, aki a saját
  Seestar-képeihez keresett egyszerű utat, és úgy gondolta, másnak is jól jöhet. Ha hasznosnak
  találod, és teheted, egy kávé árával támogathatod a további fejlesztést. Köszönöm, és tiszta eget!
