metaDescription: Kezdőbarát asztrofotó-feldolgozás Windowsra – a nyers képektől a kész fotóig 16 vezetett lépésben. Ingyenes és nyílt forráskódú.
ogTitle: ClearStar – a nyers képektől a kész asztrofotóig
langGroup: Nyelv

eyebrow: Ingyenes, nyílt forráskódú · Windows 10 és 11
heroTitle: A nyers képektől a kész asztrofotóig.
heroLead: >-
  A ClearStar kézen fog: 16 lépésben, mindegyiknél közérthető magyarázattal és jó
  alapbeállításokkal lesz a Seestar- vagy fényképezőgépes felvételeidből kész kép.
  Ha csak végigkattintod, akkor is szép lesz – ha akarod, bármelyik lépésbe belenyúlhatsz.
ctaStore: Letöltés a Microsoft Store-ból
ctaGithub: Forráskód a GitHubon
viewerTitle: Feldolgozás
viewerDone: 16 / 16 lépés kész
heroAlt: Az Androméda-galaxis (M 31) ClearStarral feldolgozva
heroCaption: "Androméda-galaxis (M 31) · 654 Seestar-felvétel, 1 óra 49 perc"

whatTitle: Mi ez?
whatText: >-
  A ClearStar asztrofotó-feldolgozó program kezdőknek: Seestar és más okostávcsövek,
  valamint fényképezőgépes asztrofotósok számára készült. Összeilleszti (stackeli) a nyers
  felvételeket, kiegyenlíti a hátteret, élesít, zajt csökkent, azonosítja a csillagokat,
  beállítja a színeket, és kiemeli a ködöket és galaxisokat. Nem kell hozzá előképzettség:
  minden lépés elmondja, mit csinál és miért, és élő előnézeten látod az eredményt.
move1Title: Töltsd be a képeidet
move1Text: "Egy mappa elég: a fény-, sötét- és flat-képeket magától szétválogatja."
move2Title: Menj végig a lépéseken
move2Text: Jó alapbeállításokkal, lépésenként egy kattintással – vagy 2–4 egyszerű csúszkával.
move3Title: Mentsd el
move3Text: Megosztáshoz (JPEG), nyomtatáshoz (16 bites TIFF) vagy további szerkesztéshez (FITS).

shotsTitle: "Így néz ki"
shotsNote: "A képek az angol felületről készültek – a program magyarul is tud, alapból a Windows nyelvén indul."
shotResultAlt: "A kész kép a mentés lépésnél"
shotResult: "Kész: 16 / 16 lépés. Mentés megosztáshoz (JPEG), nyomtatáshoz (16 bites TIFF) vagy további szerkesztéshez (FITS)."
shotStretchAlt: "A ködök kiemelése lépés csúszkákkal és hisztogrammal"
shotStretch: "Ködök és galaxisok kiemelése – automatikus nyújtás egy gombbal, utána három csúszka; a kép és a hisztogram élőben követi."
shotNoiseAlt: "A zajcsökkentés lépés erősség-csúszkával"
shotNoise: "Zajcsökkentés a GraXpert AI-modelljével: egy csúszka az erősségre, a csillagok és a finom részletek megmaradnak."
shotCropAlt: "A vágás lépés kijelöléssel"
shotCrop: "Vágás: magától levágja az összeillesztés után üresen maradt sarkokat – 654 kép, 1 óra 49 perc expozíció egy képben."
shotWelcomeAlt: "Az üdvözlő ablak"
shotWelcome: "Az első indításkor röviden elmondja, mi következik. Bal oldalt végig látod, hol tartasz."

