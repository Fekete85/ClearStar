factsTitle: Jó tudni
fSystem: Rendszer
fSystemText: Windows 10 (2004-es verziótól) vagy Windows 11, 64 bites. Magyar és angol felület.
fInput: Bemenet
fInputText: FITS, TIFF, PNG, JPEG – mono, RGB és nyers Bayer-mintás (OSC) képek.
fAi: AI-lépések
fAiText: A GraXpert nyílt modelljeivel, a videokártyán (DirectML) vagy a processzoron. A modelleket egy gombnyomással letölti; ha a GraXpert telepítve van, az ő modelljeit is megtalálja.
fStarnet: Csillagleválasztás
fStarnetText: A saját StarNet2 programodat használja – a ClearStar elmondja, honnan szerezheted be.
fPrivacy: Adatvédelem
fPrivacyText: Nem gyűjt adatot, nincs fiók és telemetria. Hálózatot csak a csillagkatalógus-lekéréshez és az általad kért letöltésekhez használ.
