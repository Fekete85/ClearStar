factsTitle: Good to know
fSystem: System
fSystemText: Windows 10 (version 2004 or later) or Windows 11, 64-bit. Hungarian and English UI.
fInput: Input
fInputText: FITS, TIFF, PNG, JPEG – mono, RGB and raw Bayer-pattern (OSC) images.
fAi: AI steps
fAiText: With GraXpert's open models, on your GPU (DirectML) or CPU. The models download with one click; an installed GraXpert's models are found too.
fStarnet: Star removal
fStarnetText: Uses your own StarNet2 – ClearStar tells you where to get it.
fPrivacy: Privacy
fPrivacyText: No data collection, no account, no telemetry. The network is used only for star catalogue queries and downloads you ask for.
fPrivacyLink: Details
fLicense: Licence
fLicenseText: GPL-3.0. It learned from the work of Siril and GraXpert; GraXpert's AI models are licensed CC BY-NC-SA 4.0.

supportText: >-
  ClearStar is free and open source – the hobby project of an amateur astronomer who wanted a
  simple path for his own Seestar images and figured others might use it too. If you find it
  useful and can spare it, the price of a coffee helps keep the development going. Thank you,
  and clear skies!
