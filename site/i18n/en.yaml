metaDescription: Beginner-friendly astrophotography processing for Windows – raw frames to a finished photo in 16 guided steps. Free and open source.
ogTitle: ClearStar – from raw frames to a finished astrophoto
langGroup: Language

eyebrow: Free and open source · Windows 10 and 11
heroTitle: From raw frames to a finished astrophoto.
heroLead: >-
  ClearStar holds your hand: in 16 steps, each with a plain-language explanation and good
  defaults, your Seestar or camera frames become a finished image. Click straight through
  and it still looks good – or dig into any step you like.
ctaStore: Get it from Microsoft Store
