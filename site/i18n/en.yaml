whatTitle: What is it?
whatText: >-
  ClearStar is astrophoto processing for beginners, made for owners of Seestar and other smart
  telescopes and for camera astrophotographers. It stacks your raw frames, flattens the
  background, sharpens, reduces noise, identifies the stars, calibrates the colours and brings
  out nebulae and galaxies. No prior experience needed: every step tells you what it does and
  why, and you see the result in a live preview.
move1Title: Load your images
move1Text: "One folder is enough: light, dark and flat frames are sorted automatically."
move2Title: Work through the steps
move2Text: Good defaults, one click each – or 2–4 simple sliders if you want.
move3Title: Save it
move3Text: For sharing (JPEG), printing (16-bit TIFF) or further editing (FITS).

